name: Review upstream release
on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare stable upstream with the qualified version
        run: |
          sudo useradd --create-home tester
          sudo install -d -o tester -g tester /home/tester/upstream
          sudo cp .github/one-upstream.json ci/check_upstream.py /home/tester/upstream/
          sudo chown -R tester:tester /home/tester/upstream
          sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
            sh -c 'cd /home/tester/upstream && python3 check_upstream.py'
